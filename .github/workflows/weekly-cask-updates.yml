on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tap this checkout
        run: |
          brew tap josephalton/other-cask-tap "$GITHUB_WORKSPACE"
          brew trust josephalton/other-cask-tap

      - name: Bump outdated cask versions and push
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          while IFS=$'\t' read -r cask current latest; do
            [[ -z "${cask}" || -z "${current}" || -z "${latest}" ]] && continue
            cask_path="Casks/${cask}.rb"
            if [[ ! -f "${cask_path}" ]]; then
              echo "Missing ${cask_path}, skipping"
              continue
            fi

            echo "Bumping ${cask}: ${current} -> ${latest}"
            CURRENT="${current}" LATEST="${latest}" perl -i -pe \
              's/\Qversion "$ENV{CURRENT}"\E/version "$ENV{LATEST}"/' \
              "${cask_path}"

            if git diff --quiet -- "${cask_path}"; then
              echo "No change written for ${cask}, skipping commit"
              continue
            fi

            git add "${cask_path}"
            git commit -m "${cask}: bump to ${latest}"
          done < <(
            brew livecheck --tap josephalton/other-cask-tap --json --newer-only \
              | jq -r '.[]
                | select(.version.outdated == true)
                | [(.cask // .formula), .version.current, .version.latest]
                | @tsv'
          )

          git push origin HEAD:"${GITHUB_REF_NAME}"
